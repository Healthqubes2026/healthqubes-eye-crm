worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
  limit_req_zone $binary_remote_addr zone=location:10m rate=20r/m;

  upstream healthqubes_api {
    server api:5000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    # Uncomment below when SSL cert is in place:
    # return 301 https://$host$request_uri;

    # For now, proxy directly (dev / staging)
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  # ── HTTPS (uncomment when SSL certs are ready) ─────────────────────────────
  # server {
  #   listen 443 ssl http2;
  #   server_name api.healthqubes.in;
  #
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #
  #   include /etc/nginx/conf.d/proxy_params.conf;
  # }

  # Shared proxy config (inlined here for single-file setup)
  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 15M;

    # Health check (no rate limit)
    location /health {
      proxy_pass http://healthqubes_api;
      proxy_http_version 1.1;
    }

    # Auth endpoints — strict rate limit
    location ~ ^/api/v1/auth/(login|otp|verify) {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass         http://healthqubes_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        "";
    }

    # Location updates — medium rate limit
    location /api/v1/location/update {
      limit_req zone=location burst=10 nodelay;
      proxy_pass         http://healthqubes_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        "";
    }

    # All other API routes
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://healthqubes_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        "";
      proxy_read_timeout 60s;
    }

    # Serve uploaded files directly from nginx (bypasses Node)
    location /uploads/ {
      alias /var/www/uploads/;
      expires 7d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff;
    }

    # Block everything else
    location / {
      return 404 '{"success":false,"message":"Not found"}';
      add_header Content-Type application/json;
    }
  }
}
