# =============================================================================
# Healthqubes Eye — Production Nginx Configuration
# Place in /etc/nginx/sites-available/healthqubes
# Symlink: ln -s /etc/nginx/sites-available/healthqubes /etc/nginx/sites-enabled/
# =============================================================================

# Rate limiting zones (add to /etc/nginx/nginx.conf http block if not present)
# limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;
# limit_req_zone $binary_remote_addr zone=loc:10m   rate=20r/m;

# ── Upstream API ──────────────────────────────────────────────────────────────
upstream healthqubes_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.healthqubes.in admin.healthqubes.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── API Server (HTTPS) ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.healthqubes.in;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/api.healthqubes.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.healthqubes.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"           always;
    add_header X-Content-Type-Options   "nosniff"              always;
    add_header X-XSS-Protection         "1; mode=block"        always;
    add_header Referrer-Policy          "strict-origin"        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── General ───────────────────────────────────────────────────────────────
    client_max_body_size 15M;
    gzip on;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1000;

    # ── Health (no rate limit) ────────────────────────────────────────────────
    location = /health {
        proxy_pass         http://healthqubes_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ── Auth endpoints — strict rate limit ────────────────────────────────────
    location ~ ^/api/v1/auth/(login|otp|verify) {
        limit_req         zone=auth burst=5 nodelay;
        limit_req_status  429;

        proxy_pass         http://healthqubes_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Location updates — medium rate limit ──────────────────────────────────
    location = /api/v1/location/update {
        limit_req         zone=loc burst=10 nodelay;
        proxy_pass         http://healthqubes_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── All other API routes ──────────────────────────────────────────────────
    location /api/ {
        limit_req         zone=api burst=30 nodelay;
        limit_req_status  429;

        proxy_pass         http://healthqubes_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Static file uploads (served by Nginx directly — bypass Node) ──────────
    location /uploads/ {
        alias   /opt/healthqubes-eye/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;

        # Only allow image and PDF types
        location ~* \.(jpg|jpeg|png|webp|pdf)$ { }
        location ~ { return 403; }
    }

    # ── Block everything else ─────────────────────────────────────────────────
    location / {
        return 404 '{"success":false,"message":"Not found"}';
        add_header Content-Type application/json always;
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/healthqubes-api-access.log;
    error_log  /var/log/nginx/healthqubes-api-error.log warn;
}

# ── Admin Panel (HTTPS) ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.healthqubes.in;

    ssl_certificate     /etc/letsencrypt/live/api.healthqubes.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.healthqubes.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root  /opt/healthqubes-eye/admin/build;
    index index.html;

    # ── React SPA — route all to index.html ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── JS/CSS/media assets — long cache ─────────────────────────────────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log /var/log/nginx/healthqubes-admin-access.log;
    error_log  /var/log/nginx/healthqubes-admin-error.log warn;
}
